name: Mobile first-paint APK

on:
  push:
    branches:
      - mobile-random-group-first-paint
  pull_request:
    branches:
      - scriptable-symmetry-patterns-apk
      - cayley
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test and verify mobile entry point
        run: |
          npm test
          node --check MobileGroup.js
          node --check Mobile.js
          node --check MobileTable.js
          test -s Mobile.html
          test -s Mobile.js
          test -s MobileGroup.js
          test -s MobileTable.js
          grep -F "new MobileGroup(await response.text()" Mobile.js
          grep -F "await import('./MobileTable.js')" Mobile.js
          ! grep -F "./js/Library.js" Mobile.js
          ! grep -F "./js/XMLGroup.js" Mobile.js
          ! grep -F "./js/CayleyDiagramView.js" Mobile.js
          ! grep -F "./js/MulttableView.js" Mobile.js
          ! grep -F "toDataURL" Mobile.js
          ! grep -Fi "jquery" Mobile.html
          node <<'NODE'
          const fs = require('fs')
          const source = fs.readFileSync('Mobile.js', 'utf8')
          const diagram = source.indexOf('createCayleyCanvas(graph, size)')
          const paint = source.indexOf('await afterPaint()')
          const table = source.indexOf("await import('./MobileTable.js')")
          if (!(diagram >= 0 && diagram < paint && paint < table)) process.exit(1)
          NODE
          grep -F 'Mobile.html' android-app/app/src/main/java/org/isomorphisms/groupexplorer/MainActivity.java
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify bundled mobile app
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/site/Mobile.html"
          unzip -l "$APK" | grep -F "assets/site/Mobile.js"
          unzip -l "$APK" | grep -F "assets/site/MobileGroup.js"
          unzip -l "$APK" | grep -F "assets/site/MobileTable.js"
          unzip -l "$APK" | grep -F "assets/site/groups/Z_5.group"
          cp "$APK" cayley-mobile-first-paint-debug.apk
          sha256sum cayley-mobile-first-paint-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cayley-mobile-first-paint-apk
          path: cayley-mobile-first-paint-debug.apk
          if-no-files-found: error
          retention-days: 30

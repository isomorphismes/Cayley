name: Charcoal browser and compatibility resources
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-vendor@ff34c4100bc7063aab245f8088b4abee77df3e3a
        with:
          header: '-'
          resources: android-app/app/src/main/res
      - name: Retain exact preceding scientific implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eab521b2d860e896a3fbecec6460633202551c5d
          path: .baseline
          persist-credentials: false
      - name: Check out the actual Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ithon
          ref: d6e83969f82512e920fb17b44326cb54f31d015c
          path: .ithon
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Lib/ithon_run.py
            Lib/ithon_frontend.py
            Lib/ithon_static.py
      - name: Check the complete Ithon module before installing browser dependencies
        run: python3 .ithon/Lib/ithon_run.py -c 'from ithon_frontend import check_file; check_file("examples/autogenerated/charcoal-browser/check.pi")'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Preserve group, pattern and lazy-first-paint regression tests
        run: grease/bin/grease examples/autogenerated/charcoal-browser/tests.grease
      - run: python3 -m venv .browser-runtime
      - run: .browser-runtime/bin/pip install playwright==1.56.0
      - run: .browser-runtime/bin/python -m playwright install --with-deps chromium
      - name: Check and execute maintained Ithon browser acceptance
        env:
          ITHON_CHECK_RECEIPT: ${{ github.workspace }}/ithon-check-receipt.jsonl
        run: .browser-runtime/bin/python .ithon/Lib/ithon_run.py examples/autogenerated/charcoal-browser/check.pi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cayley-charcoal-browser
          path: |
            build/charcoal/
            ithon-check-receipt.jsonl
          if-no-files-found: warn

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cayley</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #212121; color: #F4F4F4; }
        body { font-family: system-ui, sans-serif; }
        main {
            width: 100vw;
            height: 100dvh;
            display: grid;
            grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
        }
        .view {
            min-width: 0;
            min-height: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
        }
        .view + .view { border-top: 1px solid #454545; }
        .view canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
        #again {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: max(14px, env(safe-area-inset-bottom));
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 50%;
            background: #383838;
            color: #F4F4F4;
            box-shadow: 0 2px 12px rgba(0,0,0,.22);
            font: 28px/1 system-ui, sans-serif;
        }
        #again:disabled { color: #858585; }
        #again:focus-visible { outline: 3px solid #B4B4B4; outline-offset: 3px; }
        ::selection { background: #595959; color: #F4F4F4; }
        #error {
            position: fixed;
            inset: 0;
            display: none;
            padding: 24px;
            background: #212121;
            color: #FFB4AB;
            white-space: pre-wrap;
        }
    </style>
    <script type="module" src="./Mobile.js"></script>
</head>
<body>
    <main aria-label="Selected group">
        <section id="cayley" class="view" aria-label="Cayley diagram"></section>
        <section id="multtable" class="view" aria-label="Multiplication table"></section>
    </main>
    <button id="again" type="button" aria-label="Show another random group">↻</button>
    <pre id="error" role="alert"></pre>
</body>
</html>
